name: Daily Repo Report

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 한국시간(KST) 오전 9시
  workflow_dispatch:        # 수동 실행 버튼 (테스트용)

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃 (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 리포트 데이터 수집
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TODAY=$(date -u +%Y-%m-%d)
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%d)

          {
            echo "## 📊 ${REPO} 데일리 리포트 (${TODAY})"
            echo ""
            echo "### 🔨 최근 24시간 커밋"
            git log --since="24 hours ago" --pretty=format:"- \`%h\` %s (%an)" || echo "- 없음"
            echo ""
            echo ""
            echo "### 🔀 새로 생성된 Pull Request"
            gh pr list --repo "$REPO" --search "created:>=${SINCE}" \
              --json number,title,author,url \
              --jq '.[] | "- #\(.number) \(.title) (@\(.author.login)) \(.url)"' || echo "- 없음"
            echo ""
            echo "### 🐛 새로 등록된 이슈"
            gh issue list --repo "$REPO" --search "created:>=${SINCE}" \
              --json number,title,author,url \
              --jq '.[] | "- #\(.number) \(.title) (@\(.author.login)) \(.url)"' || echo "- 없음"
          } > report.md

          {
            echo "body<<EOF"
            cat report.md
            echo "EOF"
            echo "date=${TODAY}"
          } >> "$GITHUB_OUTPUT"

      - name: 이메일 발송
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ github.repository }}] 데일리 리포트 - ${{ steps.report.outputs.date }}"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: ${{ steps.report.outputs.body }}
          convert_markdown: true
